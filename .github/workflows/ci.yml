name: TomatCare CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  fastapi-tests:
    name: FastAPI Contract & Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r ./fastapi/requirements.txt pandas httpx pytest

      - name: Run FastAPI Contract & API Tests
        working-directory: ./fastapi
        run: |
          python test_api.py

  laravel-tests:
    name: Laravel PHPUnit Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, openssl, pdo_sqlite, fileinfo

      - name: Install Composer dependencies
        working-directory: ./laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env.example to .env
        working-directory: ./laravel
        run: cp .env.example .env

      - name: Generate Application Key
        working-directory: ./laravel
        run: php artisan key:generate

      - name: Run Laravel PHPUnit Tests
        working-directory: ./laravel
        run: php artisan test
